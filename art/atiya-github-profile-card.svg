
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062635"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#241535"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#28d9ff"/>
      <stop offset="100%" stop-color="#8b7cff"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="1194" height="354" rx="28" fill="url(#bg)" stroke="#159ed0" stroke-width="2"/>
  <rect x="25" y="25" width="1150" height="310" rx="25" fill="none" stroke="#176c9b" stroke-width="2"/>

  <!-- Profile photo area -->
  <circle cx="130" cy="175" r="68" fill="#07131f" stroke="#13c9f5" stroke-width="4"/>
  <image href="https://github.com/Atiya1231.png"
