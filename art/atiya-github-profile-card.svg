    <rect x="225" y="260" width="125" height="37" rx="18" fill="#141e30" stroke="#159ed0" stroke-width="1.5"/>
    <text x="287" y="284">HTML</text>

    <rect x="365" y="260" width="125" height="37" rx="18" fill="#141e30" stroke="#159ed0" stroke-width="1.5"/>
    <text x="427" y="284">CSS</text>

    <rect x="505" y="260" width="165" height="37" rx="18" fill="#141e30" stroke="#159ed0" stroke-width="1.5"/>
    <text x="587" y="284">JavaScript</text>

    <rect x="685" y="260" width="125" height="37" rx="18" fill="#141e30" stroke="#159ed0" stroke-width="1.5"/>
    <text x="747" y="284">Java</text>
  </g>

  <!-- Coffee icon retained -->
  <circle cx="1050" cy="150" r="58" fill="#111a2d" stroke="#263858" stroke-width="2"/>
  <text x="1050" y="165" text-anchor="middle"
        fill="#72dcff" font-family="Arial, sans-serif"
        font-size="38">☕</text>

  <text x="1050" y="235" text-anchor="middle"
        fill="#72dcff" font-family="Arial, sans-serif"
        font-size="12" font-weight="bold" letter-spacing="1">KEEP BUILDING</text>
