         preserveAspectRatio="xMidYMid slice"/>
  <circle cx="130" cy="175" r="55" fill="none" stroke="#13c9f5" stroke-width="2"/>

  <!-- Name only: tagline removed -->
  <text x="225" y="105" fill="#72dcff"
        font-family="Arial, sans-serif" font-size="20"
        font-weight="bold" letter-spacing="3">@ATIYA1231</text>

  <text x="225" y="180" fill="url(#title)"
        font-family="Arial, sans-serif" font-size="64"
        font-weight="bold">Atiya Ali ✨</text>

